# Reusable Python CI for uv-based magitech-ai repos.
#
# Shared skeleton: checkout -> setup-uv -> install Python -> install deps ->
# lint -> test -> enforce the 100% coverage floor. Callers override the
# commands that differ per repo.
#
# Caller example (anima):
#   jobs:
#     test:
#       uses: magitech-ai/.github/.github/workflows/python-ci.yml@main
#       with:
#         python-version: "3.12"
#
# Caller example (magitech-harness, needs anima as a sibling checkout):
#   jobs:
#     test:
#       uses: magitech-ai/.github/.github/workflows/python-ci.yml@main
#       with:
#         python-version: "3.12"
#         checkout-path: "magitech-harness"
#         working-directory: "magitech-harness"
#         pre-commands: |
#           git clone --depth 1 https://github.com/magitech-ai/anima.git anima
#
# Sibling clones in pre-commands rely on the magitech-ai repos being public;
# no token is needed for them. The 100% coverage floor is enforced twice:
# each repo's pyproject carries --cov-fail-under=100 --cov-branch, and the
# coverage step below re-checks it, so a repo whose pytest config loses the
# floor still fails here instead of silently passing.
#
# OS matrix: the job runs on every label in `os-matrix-json` (default:
# ubuntu/windows/macos latest). Callers pass a subset to narrow it.
# Windows runners use pwsh for `run:` steps; pre-commands and lint/test
# commands must stay shell-neutral (plain commands, one per line).
#
# Proxy bypass: the "Sanitize proxy bypass list" step runs before Test and
# rewrites NO_PROXY/no_proxy in the runner env — bracketed IPv6 entries
# (e.g. "[::1]") make httpx 0.28.1 raise InvalidURL on any AsyncClient
# construction, so brackets are stripped, and localhost/127.0.0.1 are
# always kept in the bypass list so HTTP tests binding localhost never go
# through a proxy. Callers must not set NO_PROXY via test-env-json; the
# sanitize step owns those two variables.

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version installed via `uv python install`"
        required: false
        default: "3.12"
        type: string
      checkout-path:
        description: "Subdirectory the calling repo is checked out into ('.' = workspace root)"
        required: false
        default: "."
        type: string
      working-directory:
        description: "Directory the install/lint/test steps run in"
        required: false
        default: "."
        type: string
      pre-commands:
        description: "Shell commands run after checkout, before install (e.g. clone sibling repos)"
        required: false
        default: ""
        type: string
      install-command:
        description: "Dependency install command"
        required: false
        default: "uv sync"
        type: string
      run-lint:
        description: "Whether to run the lint step"
        required: false
        default: true
        type: boolean
      lint-commands:
        description: "Lint/typecheck commands (multiline shell)"
        required: false
        default: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
        type: string
      run-tests:
        description: "Whether to run the test step"
        required: false
        default: true
        type: boolean
      test-commands:
        description: "Test commands (multiline shell)"
        required: false
        default: "uv run pytest"
        type: string
      test-env-json:
        description: "JSON object of env vars for the test step, e.g. '{\"FOO\": \"bar\"}'"
        required: false
        default: "{}"
        type: string
      enforce-coverage:
        description: "Whether to re-check the coverage floor after tests"
        required: false
        default: true
        type: boolean
      coverage-floor:
        description: "Minimum total (statement + branch) coverage percent"
        required: false
        default: 100
        type: number
      os-matrix-json:
        description: "JSON array of runner labels, e.g. '[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]'"
        required: false
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        type: string
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        default: 20
        type: number

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix-json) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ inputs.checkout-path }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.12.24"

      - name: Set up Python ${{ inputs.python-version }}
        run: uv python install ${{ inputs.python-version }}

      - name: Pre-install setup
        if: inputs.pre-commands != ''
        run: ${{ inputs.pre-commands }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Lint
        if: inputs.run-lint
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-commands }}

      - name: Set test environment
        if: inputs.run-tests && inputs.test-env-json != '{}'
        shell: python
        run: |
          import json, os
          d = json.loads(r'''${{ inputs.test-env-json }}''')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for k, v in d.items():
                  f.write(f"{k}={v}\n")

      - name: Sanitize proxy bypass list
        if: inputs.run-tests
        shell: python
        run: |
          import os
          # Bracketed IPv6 entries in NO_PROXY/no_proxy (e.g. "[::1]")
          # make httpx 0.28.1 raise InvalidURL on any AsyncClient
          # construction. Strip the brackets and always keep
          # localhost/127.0.0.1 bypassed so HTTP tests binding localhost
          # never go through a proxy.
          for var in ("NO_PROXY", "no_proxy"):
              parts = []
              for p in os.environ.get(var, "").split(","):
                  p = p.strip()
                  if p.startswith("[") and p.endswith("]"):
                      p = p[1:-1]
                  if p and p not in parts:
                      parts.append(p)
              for keep in ("localhost", "127.0.0.1"):
                  if keep not in parts:
                      parts.append(keep)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"{var}={','.join(parts)}\n")

      - name: Test
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-commands }}

      - name: Enforce coverage floor
        if: inputs.run-tests && inputs.enforce-coverage
        working-directory: ${{ inputs.working-directory }}
        run: uv run python -m coverage report --fail-under=${{ inputs.coverage-floor }}
